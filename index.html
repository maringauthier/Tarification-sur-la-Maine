<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculateur de redevance AOT – Plan d'eau de la Maine</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#1b2a38; --muted:#5d6b78; --line:#d9e0e6;
    --accent:#0b5c8a; --accent-soft:#e3f0f8; --warn:#8a5a00; --warn-bg:#fff4dc;
    --up:#a3321f; --down:#1c7a43;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#10181f; --card:#18232d; --ink:#e8eef3; --muted:#9aabb9; --line:#2b3a47;
      --accent:#5db4e6; --accent-soft:#17303f; --warn:#f0c060; --warn-bg:#33290f;
      --up:#ff8a75; --down:#5fd18d; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:1.5rem;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
  .card h2{font-size:1rem;margin:0 0 14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  label{display:block;font-weight:600;margin:0 0 4px}
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  select,input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
  select:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:480px){.row{grid-template-columns:1fr}}
  .check{display:flex;gap:10px;align-items:flex-start;font-weight:500}
  .check input{margin-top:5px;width:18px;height:18px}
  .hint{color:var(--muted);font-size:.875rem;margin-top:4px}
  .hidden{display:none!important}
  .result{background:var(--accent-soft);border-color:var(--accent)}
  .total{font-size:2.2rem;font-weight:700;color:var(--accent);line-height:1.1}
  .total small{font-size:1rem;font-weight:500;color:var(--muted)}
  table{width:100%;border-collapse:collapse;margin-top:14px;font-size:.95rem}
  td{padding:6px 0;border-bottom:1px solid var(--line)}
  td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  .warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:.9rem}
  .empty{color:var(--muted);margin:0}
  .sum td{font-weight:600;font-size:1rem}
  .detail{color:var(--muted);font-size:.875rem}
  .detail td{padding:3px 0;border-bottom:0}
  .up{color:var(--up)}
  .down{color:var(--down)}
</style>
</head>
<body>
<main>
  <h1>Calculateur de redevance d'occupation</h1>
  <section class="card">
    <h2>1. Type d'usage</h2>
    <div class="field">
      <label for="usage">Usage du bateau</label>
      <select id="usage"></select>
    </div>
    <div class="field" id="f-secteur">
      <label for="secteur" id="l-secteur">Secteur occupé</label>
      <select id="secteur"></select>
    </div>
    <div class="field hidden" id="f-marchand">
      <label class="check"><input type="checkbox" id="marchand">
        <span>Usage lié à de l'hébergement marchand (majoration de 25 %)</span></label>
    </div>
  </section>

  <section class="card" id="c-dim">
    <h2>2. Dimensions du bateau</h2>
    <div class="row">
      <div class="field">
        <label for="lht">Longueur (m)</label>
        <input type="number" id="lht" min="0" step="0.01" inputmode="decimal" placeholder="ex. 12,50">
      </div>
      <div class="field">
        <label for="largeur">Largeur (m)</label>
        <input type="number" id="largeur" min="0" step="0.01" inputmode="decimal" placeholder="ex. 4,20">
      </div>
    </div>
  </section>

  <section class="card result" aria-live="polite">
    <h2>Redevance annuelle</h2>
    <div id="out"><p class="empty">Renseignez les informations ci-dessus.</p></div>
  </section>

  <section class="card hidden" id="c-comp" aria-live="polite">
    <h2>Comparatif avec l'ancienne tarification</h2>
    <div id="cmp"></div>
  </section>
</main>

<script>
/* ===== Données tarifaires 2025 (€ TTC) – à modifier ici si la grille évolue ===== */
const FIXE = 1000;          // redevance fixe annuelle
const SEUIL_REF = 50;       // surface incluse dans la redevance fixe ; la part variable porte sur ce qui dépasse
const SEUIL_T2 = 100;       // à partir de 100 m² (soit plus de 50 m² au-dessus du seuil), le prix unitaire change

// p1 = prix €/m² excédentaire tranche 50–99,99 m² ; p2 = tranche ≥ 100 m²
const TARIFS = {
  plaisance: {
    label: "Plaisance privée",
    secteurLabel: "Ponton",
    secteurs: {
      savatteA:     { label: "Ponton A Savatte", p1: 40, p2: 30 },
      savatteB:     { label: "Ponton B Savatte", p1: 47, p2: 30 },
      hauteReculee: { label: "Ponton Haute Reculée", p1: 40, p2: 30 },
      barques:      { label: "Barques et futreaux sur emplacements dédiés dans le port", forfait: 50 }
    }
  },
  habitation: {
    label: "Bateau à usage d'habitation (location inclus)",
    secteurLabel: "Secteur",
    marchand: true,
    secteurs: {
      caleSavatte: { label: "Cale de la Savatte", p1: 25, p2: 20 },
      berges:      { label: "Berges non aménagées", p1: 40, p2: 15 }
    }
  },
  pro: {
    label: "Bateau à usage professionnel",
    secteurLabel: "Type d'unité",
    secteurs: {
      navigant: { label: "Unité navigant régulièrement", p1: 50, p2: 20 },
      fixe:     { label: "Unité à usage fixe", p1: 10, p2: 25 }
    }
  }
};
const MAJ_MARCHAND = 0.25;

/* ===== Ancienne tarification (€ TTC) – délibération du conseil municipal du 29/03/2021 ===== */
const ANCIEN = {
  reculee:   { emplacementMois: 59.44, chargesMois: 6.67 },   // pontons promenade de Reculée
  pontonA:   { nuitee1a14: 10.91, nuitee15: 21.83, hivernageMois: 46.55, habitableMois: 90.37 },
  pontonB:   [ { min: 5,  max: 7.99,  mois: 63.13 },          // plaisance permanente, eau incluse
               { min: 8,  max: 12.99, mois: 74.26 },
               { min: 13, max: 15.99, mois: 92.84 } ],
  penicheMl: 49.21,                                           // péniche de vie, résidence principale (par an et par ml)
  pro:       { riviere: 66.83, sansLien: 103.94 }             // par an et par ml
};

/* ===== Interface ===== */
const $ = id => document.getElementById(id);
const eur = n => n.toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
const m2 = n => n.toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " m²";
const nb = n => n.toLocaleString("fr-FR", { maximumFractionDigits: 2 });
const r2 = n => Math.round(n * 100) / 100;

function fillUsage(){
  $("usage").innerHTML = '<option value="">— Choisir —</option>' +
    Object.entries(TARIFS).map(([k,v]) => `<option value="${k}">${v.label}</option>`).join("");
}
function fillSecteurs(){
  const u = TARIFS[$("usage").value];
  const sel = $("secteur");
  if(!u){ sel.innerHTML = '<option value="">—</option>'; $("f-marchand").classList.add("hidden"); return; }
  $("l-secteur").textContent = u.secteurLabel;
  sel.innerHTML = '<option value="">— Choisir —</option>' +
    Object.entries(u.secteurs).map(([k,v]) => `<option value="${k}">${v.label}</option>`).join("");
  $("f-marchand").classList.toggle("hidden", !u.marchand);
  if(!u.marchand) $("marchand").checked = false;
}

/* Calcule ce que le bateau payait avant. Renvoie { total, lines, notes } ou { na: "raison" } */
function ancienTarif(usage, secteur, L, marchand){
  const A = ANCIEN, lines = [], notes = [];

  if(usage === "plaisance"){
    if(secteur === "hauteReculee"){
      const e = A.reculee.emplacementMois * 12, c = A.reculee.chargesMois * 12;
      lines.push([`Emplacement : 12 mois × ${eur(A.reculee.emplacementMois)}`, e]);
      lines.push([`Forfait charges : 12 mois × ${eur(A.reculee.chargesMois)}`, c]);
      return { total: e + c, lines, notes };
    }
    if(secteur === "savatteB"){
      // En dessous de 5 m, on applique le tarif de la première tranche (5 à 7,99 m)
      const t = L < A.pontonB[0].min ? A.pontonB[0] : A.pontonB.find(x => L >= x.min && L < x.max + 0.01);
      if(!t) return { na: "L'ancienne grille du ponton B ne couvre que les bateaux jusqu'à 15,99 m." };
      lines.push([`Bateau de ${nb(t.min)} à ${nb(t.max)} m : 12 mois × ${eur(t.mois)}`, t.mois * 12]);
      return { total: t.mois * 12, lines, notes };
    }
    if(secteur === "savatteA"){
      const hs = A.pontonA.habitableMois * 6, bs = A.pontonA.hivernageMois * 6;
      lines.push([`Haute saison (1er mai – 31 oct.) : 6 mois × ${eur(A.pontonA.habitableMois)}`, hs]);
      lines.push([`Basse saison (1er nov. – 30 avr.) : 6 mois × ${eur(A.pontonA.hivernageMois)}`, bs]);
      return { total: hs + bs, lines, notes };
    }
    return { na: "L'ancienne grille ne prévoit pas de tarif pour les barques et futreaux." };
  }

  if(usage === "habitation"){
    if(marchand){
      const t = A.pontonA.habitableMois * 6;
      lines.push([`Bateau habitable destiné à la location, haute saison (1er mai – 31 oct.) : 6 mois × ${eur(A.pontonA.habitableMois)}`, t]);
      return { total: t, lines, notes };
    }
    lines.push([`Péniche de vie, résidence principale : ${nb(L)} m × ${eur(A.penicheMl)}/ml`, L * A.penicheMl]);
    return { total: L * A.penicheMl, lines, notes };
  }

  if(usage === "pro"){
    const fixe = secteur === "fixe";
    const p = fixe ? A.pro.sansLien : A.pro.riviere;
    lines.push([`Activité ${fixe ? "sans lien avec la rivière" : "en lien avec la rivière (bateau de promenade)"} : ${nb(L)} m × ${eur(p)}/ml`, L * p]);
    return { total: L * p, lines, notes };
  }
  return { na: "" };
}

function renderComparatif(newTotal, old){
  const card = $("c-comp"), el = $("cmp");
  card.classList.remove("hidden");
  if(old.na){ el.innerHTML = `<p class="empty">${old.na}</p>`; return; }

  const o = r2(old.total), n = r2(newTotal), diff = r2(n - o);
  const pct = o > 0 ? (diff / o) * 100 : null;
  const cls = diff > 0 ? "up" : diff < 0 ? "down" : "";
  const sign = diff > 0 ? "+" : diff < 0 ? "−" : "";
  const abs = eur(Math.abs(diff));
  const pctTxt = pct === null ? "" : ` (${sign}${Math.abs(pct).toLocaleString("fr-FR", { maximumFractionDigits: 1 })} %)`;

  el.innerHTML =
    "<table>" +
      `<tr><td>Ancienne redevance annuelle</td><td>${eur(o)}</td></tr>` +
      `<tr><td>Nouvelle redevance annuelle</td><td>${eur(n)}</td></tr>` +
      `<tr class="sum"><td>Écart</td><td class="${cls}">${sign}${abs}${pctTxt}</td></tr>` +
    "</table>" +
    `<table class="detail">${old.lines.map(l => `<tr><td>${l[0]}</td><td>${eur(r2(l[1]))}</td></tr>`).join("")}</table>`;
}

function calcul(){
  const usage = $("usage").value, secteur = $("secteur").value;
  const u = TARIFS[usage];
  const s = u && u.secteurs[secteur];
  const out = $("out");
  const showDim = !(s && s.forfait);
  $("c-dim").classList.toggle("hidden", !showDim);
  $("c-comp").classList.add("hidden");

  if(!u || !s){ out.innerHTML = '<p class="empty">Renseignez les informations ci-dessus.</p>'; return; }

  const rows = [];
  let total, L = 0;

  if(s.forfait){
    rows.push(["Forfait annuel – " + s.label, eur(s.forfait)]);
    total = s.forfait;
  } else {
    L = parseFloat($("lht").value);
    const l = parseFloat($("largeur").value);
    if(!(L > 0) || !(l > 0)){ out.innerHTML = '<p class="empty">Saisissez la longueur et la largeur du bateau.</p>'; return; }
    const surf = L * l;
    rows.push(["Surface retenue (" + L.toLocaleString("fr-FR") + " m × " + l.toLocaleString("fr-FR") + " m)", m2(surf)]);
    rows.push(["Redevance fixe annuelle", eur(FIXE)]);
    total = FIXE;

    if(surf > SEUIL_REF){
      const p = surf >= SEUIL_T2 ? s.p2 : s.p1;
      const q = surf - SEUIL_REF;
      rows.push([`Surface excédentaire au-dessus de 50 m² : ${m2(q)} × ${eur(p)}/m² (${surf >= SEUIL_T2 ? "tranche ≥ 100 m²" : "tranche 50–99,99 m²"})`, eur(q * p)]);
      total += q * p;
    } else {
      rows.push(["Surface de 50 m² ou moins : part variable nulle", eur(0)]);
    }

    if(u.marchand && $("marchand").checked){
      const maj = total * MAJ_MARCHAND;
      rows.push(["Majoration hébergement marchand (+25 %)", eur(maj)]);
      total += maj;
    }
  }

  out.innerHTML =
    `<div class="total">${eur(total)} <small>TTC / an</small></div>` +
    "<table>" + rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("") + "</table>";

  renderComparatif(total, ancienTarif(usage, secteur, L, $("marchand").checked));
}

fillUsage(); fillSecteurs(); calcul();
$("usage").addEventListener("change", () => { fillSecteurs(); calcul(); });
["secteur","marchand","lht","largeur"].forEach(id => {
  $(id).addEventListener("input", calcul);
  $(id).addEventListener("change", calcul);
});
</script>
</body>
</html>
